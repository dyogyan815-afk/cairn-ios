name: Cairn
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "3"
    # Bundle ID is defined in exactly ONE documented place: here.
    # Change it here before re-signing with your own certificate.
    PRODUCT_BUNDLE_IDENTIFIER: com.example.cairnipastudio
    PRODUCT_NAME: Cairn
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Cairn:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      # The built web app is copied into Resources/WebDist (by scripts/prepare-webdist.sh
      # or by CI) and shipped as a folder reference so nested ES-module paths survive.
      - path: Resources/WebDist
        type: folder
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Cairn
        CFBundleName: Cairn
        # Versions are written LITERALLY here (xcodegen ignores the
        # MARKETING_VERSION build setting when generating the plist).
        CFBundleShortVersionString: "1.4.0"
        CFBundleVersion: "8"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS App Package
            LSItemContentTypes: [com.apple.itunes.ipa]
            CFBundleTypeRole: Viewer
          - CFBundleTypeName: ZIP Archive
            LSItemContentTypes: [public.zip-archive]
            CFBundleTypeRole: Viewer
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        ITSAppUsesNonExemptEncryption: false
        # Arbitrary loads: the "Images from a link" feature fetches the exact
        # URL the user pasted (possibly plain http) natively at the moment they
        # tap it. No other network use exists in the app.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  CairnTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Cairn
    settings:
      base:
        # Prevents the test bundle from emitting Cairn.swiftmodule, which would
        # collide with the app target's module (root PRODUCT_NAME applies here).
        PRODUCT_MODULE_NAME: CairnTests
        # Hosted tests: run inside the real app so @testable import Cairn works.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cairn.app/Cairn"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Cairn:
    build:
      targets:
        Cairn: all
    run:
      config: Release
    test:
      config: Debug
      targets:
        - CairnTests
